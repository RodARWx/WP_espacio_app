  <rect width="1560" height="920" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1560" height="74" fill="#17324D"/>
  <rect x="0" y="74" width="1560" height="4" fill="#20A69A"/>
  <text x="28" y="34" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">ESPACIO OWASP Top 10 Defense-in-Depth Security Architecture</text>
  <text x="28" y="57" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#CBD5E1">Layered security controls mapping OWASP A01–A10 across Cloudflare WAF, API Gateway, Keycloak OIDC, Spring Boot, React/Wasm &amp; ODD Monitoring</text>
  <rect x="1325" y="20" width="207" height="32" rx="16" fill="#20A69A"/>
  <text x="1429" y="41" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">GPWP-42 • ARCH-13</text>
  <g>
  <rect x="26" y="98" width="1508" height="102" rx="10" fill="#FEF2F2" stroke="#C62828" stroke-width="1.6" stroke-dasharray="6,4"/>
  <rect x="40" y="86" width="441.6" height="24" rx="5" fill="#C62828"/>
  <text x="260.8" y="102" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">External Threat Surface &amp; Adversary Vectors (OWASP Top 10)</text>
</g>
<rect x="46" y="122" width="234" height="62" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.4"/>
<text x="58" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">A01 Broken Access</text>
<text x="58" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#475569">IDOR / Role Escalation</text>
<rect x="294" y="122" width="234" height="62" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.4"/>
<text x="306" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">A02 Crypto / Secrets</text>
<text x="306" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#475569">Leaked Keys / Weak TLS</text>
<rect x="542" y="122" width="234" height="62" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.4"/>
<text x="554" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">A03 Injection / XSS</text>
<text x="554" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#475569">SQLi, NoSQLi, DOM XSS</text>
<rect x="790" y="122" width="234" height="62" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.4"/>
<text x="802" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">A05 Misconfiguration</text>
<text x="802" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#475569">Open CORS / Debug Stack</text>
<rect x="1038" y="122" width="234" height="62" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.4"/>
<text x="1050" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">A07 Auth Failures</text>
<text x="1050" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#475569">Token Theft / Brute Force</text>
<rect x="1286" y="122" width="234" height="62" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.4"/>
<text x="1298" y="144" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">A10 SSRF / Webhooks</text>
<text x="1298" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#475569">Forged Stripe / Sketch URL</text>
<g filter="url(#shadow)">
<rect x="26" y="232" width="1508" height="114" rx="8" fill="#FFF7ED" stroke="#E67E22" stroke-width="1.8"/>
<rect x="26" y="232" width="1508" height="32" rx="8" fill="#E67E22"/>
<rect x="26" y="256" width="1508" height="8" fill="#E67E22"/>
<text x="42" y="253" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Layer 1: Cloudflare Edge Perimeter (QA &amp; PROD)</text>
<rect x="1310" y="238" width="208" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1414" y="252" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#FFFFFF">A02 • A03 • A05 • A07</text>
<text x="44" y="284" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• SSL/TLS Full (Strict) + TLS 1.3 + HSTS Preload (blocks plaintext downgrade — A02)</text>
<text x="44" y="304" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Cloudflare OWASP Core Ruleset WAF blocks SQLi, NoSQLi, XSS &amp; path traversal payloads at edge (A03)</text>
<text x="44" y="324" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Edge Rate Limiting &amp; Bot Fight Mode throttle brute-force login/checkout floods (A04/A07) + Origin IP concealed</text>
</g>
<g filter="url(#shadow)">
<rect x="26" y="366" width="1508" height="114" rx="8" fill="#EDF2F7" stroke="#17324D" stroke-width="1.8"/>
<rect x="26" y="366" width="1508" height="32" rx="8" fill="#17324D"/>
<rect x="26" y="390" width="1508" height="8" fill="#17324D"/>
<text x="42" y="387" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Layer 2: AWS ALB + Spring Cloud API Gateway</text>
<rect x="1310" y="372" width="208" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1414" y="386" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#FFFFFF">A01 • A05 • A07 • A10</text>
<text x="44" y="418" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Strict Explicit CORS Allow-List (qa.espacio.app / espacio.app only — never Access-Control-Allow-Origin: *) (A05)</text>
<text x="44" y="438" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Security Response Headers injected globally: Content-Security-Policy (CSP), X-Frame-Options: DENY, X-Content-Type-Options: nosniff</text>
<text x="44" y="458" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Redis Token-Bucket Rate Limiter per IP/JWT sub + X-Correlation-ID injection + strict outbound URL/host allow-lists (A10)</text>
</g>
<g filter="url(#shadow)">
<rect x="26" y="500" width="1508" height="114" rx="8" fill="#F0FDFA" stroke="#20A69A" stroke-width="1.8"/>
<rect x="26" y="500" width="1508" height="32" rx="8" fill="#20A69A"/>
<rect x="26" y="524" width="1508" height="8" fill="#20A69A"/>
<text x="42" y="521" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Layer 3: Keycloak IAM (OAuth2 / OIDC + PKCE S256)</text>
<rect x="1310" y="506" width="208" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1414" y="520" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#FFFFFF">A01 • A02 • A07</text>
<text x="44" y="552" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Public clients use Authorization Code + PKCE (S256) with ZERO client secrets embedded in SPA/Mobile/Desktop bundles (A02/A07)</text>
<text x="44" y="572" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Short-lived RS256 signed JWT access tokens (5–15m) + refresh token rotation + brute-force lockout policies (A07)</text>
<text x="44" y="592" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Authoritative RBAC realm_access.roles (ROLE_TENANT, ROLE_LANDLORD, ROLE_ADMIN) verified against JWKS endpoint (A01)</text>
</g>
<g filter="url(#shadow)">
<rect x="26" y="634" width="1508" height="114" rx="8" fill="#ECFEFF" stroke="#0F766E" stroke-width="1.8"/>
<rect x="26" y="634" width="1508" height="32" rx="8" fill="#0F766E"/>
<rect x="26" y="658" width="1508" height="8" fill="#0F766E"/>
<text x="42" y="655" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Layer 4: Spring Boot 3 Hexagonal Backend &amp; 4 Polyglot DBs</text>
<rect x="1310" y="640" width="208" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1414" y="654" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#FFFFFF">A01 • A03 • A04 • A08</text>
<text x="44" y="686" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Method-level @PreAuthorize + Ownership checks (jwt.sub == property.landlordId / visit.tenantId) preventing IDOR/BOLA (A01)</text>
<text x="44" y="706" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Parameterized JPA/JPQL &amp; Mongo Criteria + Jakarta Bean Validation (@Positive, @Size) + RFC 7807 ProblemDetail (no stacktraces) (A03/A05)</text>
<text x="44" y="726" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• Raw-body Stripe HMAC-SHA256 verification (Webhook.constructEvent) + Redis atomic locks (INV-03) + AWS Secrets Manager (A02/A04/A08)</text>
</g>
<g filter="url(#shadow)">
<rect x="26" y="768" width="1508" height="114" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.8"/>
<rect x="26" y="768" width="1508" height="32" rx="8" fill="#6D28D9"/>
<rect x="26" y="792" width="1508" height="8" fill="#6D28D9"/>
<text x="42" y="789" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Layer 5: React MFEs, WebAssembly, CI/CD Supply Chain &amp; ODD Monitoring</text>
<rect x="1310" y="774" width="208" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
<text x="1414" y="788" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#FFFFFF">A03 • A06 • A08 • A09</text>
<text x="44" y="820" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• React auto-escaping + DOMPurify for CMS HTML + memory-only access tokens (no localStorage JWT) + Electron safeStorage (A03/A07)</text>
<text x="44" y="840" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• CI/CD Supply Chain: Dependabot / npm audit / OWASP Dependency-Check + Signed DockerHub images + Dual PR Gate (A06/A08)</text>
<text x="44" y="860" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.8" fill="#1E293B">• ODD Security Logging (A09): Immutable MongoDB domain_audit_logs + Sentry.io PII scrubbing + Site24x7 anomaly/uptime alerts</text>
</g>
